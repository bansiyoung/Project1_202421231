<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style type="text/css">
            ol li {list-style-type: lower-alpha;} /*소문자 넘버링*/
            ol {list-style-position: inside}
            ul {list-style-position: outside}
            li.kor {list-style-type: square;}
            li.usa {list-style-image: url('usa.gif');}
            #book {width:90%; min-width: 300px;border-spacing: 8px;}
            p {background-color: aqua;}
            p:hover {background-color: pink;transition: background-color 5s;}
            ul {background-color: brown;}
            li {background-color: yellow;}
            td {background-color: chartreuse;}

        </style>
    </head>
    <body>
        <p>순서가 없는 목록</p>
        <ul>
            <li class="usa">첫번째</li>
            <li class="kor">두번째</li>
            <li class="">세번째</li>
        </ul> 
        <p>순서가 있는 목록</p>
        <ol>
            <li>첫번째</li>
            <li>두번째</li>
            <li>세번째</li>
        </ol>
    </body>
</html>
